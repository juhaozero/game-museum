<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GameShot Museum">
  <title>GameShot Museum</title>
  <!-- 横置卡带 + 暂停：小尺寸高对比剪影 -->
  <rect width="32" height="32" rx="6" fill="#0b0e14"/>
  <!-- 壳体 -->
  <rect x="3" y="8" width="26" height="13" rx="2.5" fill="#1a2130"/>
  <rect x="3" y="8" width="26" height="13" rx="2.5" fill="none" stroke="#d4a24a" stroke-width="1.5"/>
  <!-- 标签区 -->
  <rect x="6" y="10.5" width="16.5" height="8" rx="1.25" fill="#07090e"/>
  <!-- 暂停（主识别） -->
  <rect x="10" y="12.25" width="2.75" height="4.5" rx="0.55" fill="#d4a24a"/>
  <rect x="15.25" y="12.25" width="2.75" height="4.5" rx="0.55" fill="#d4a24a"/>
  <!-- 右侧触点块 -->
  <rect x="24" y="11.5" width="2.5" height="1.4" rx="0.35" fill="#d4a24a"/>
  <rect x="24" y="13.8" width="2.5" height="1.4" rx="0.35" fill="#d4a24a"/>
  <rect x="24" y="16.1" width="2.5" height="1.4" rx="0.35" fill="#d4a24a"/>
  <!-- 底部插针（加粗、减量） -->
  <rect x="7" y="22.5" width="2.4" height="3.2" rx="0.45" fill="#d4a24a"/>
  <rect x="11.2" y="22.5" width="2.4" height="3.2" rx="0.45" fill="#d4a24a"/>
  <rect x="15.4" y="22.5" width="2.4" height="3.2" rx="0.45" fill="#d4a24a"/>
  <rect x="19.6" y="22.5" width="2.4" height="3.2" rx="0.45" fill="#d4a24a"/>
  <rect x="23.8" y="22.5" width="2.4" height="3.2" rx="0.45" fill="#d4a24a"/>
</svg>
