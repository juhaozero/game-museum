<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏截图收藏架</title>
    <meta
      name="description"
      content="一面自己的游戏截图收藏架。封面即回忆，每一张定格，都是当时按下的暂停键。"
    />
    <!-- canonical / og:url 由 vite 按 PUBLIC_SITE_URL + PUBLIC_ROUTE_SUFFIX 注入；运行时 DocumentMeta 按路由更新 -->
    <link rel="canonical" href="%SITE_CANONICAL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="游戏截图收藏架" />
    <meta property="og:title" content="游戏截图收藏架" />
    <meta
      property="og:description"
      content="一面自己的游戏截图收藏架。封面即回忆，每一张定格，都是当时按下的暂停键。"
    />
    <meta property="og:url" content="%SITE_CANONICAL%" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="游戏截图收藏架" />
    <meta
      name="twitter:description"
      content="一面自己的游戏截图收藏架。封面即回忆，每一张定格，都是当时按下的暂停键。"
    />
    <!-- 深色主场：首屏前应用主题；PUBLIC_ENABLE_LIGHT_MODE 关闭时强制 dark -->
    <script>
      ;(function () {
        try {
          var rawFlag = '%PUBLIC_ENABLE_LIGHT_MODE%'
          var enableLight =
            rawFlag.indexOf('%') === -1 &&
            /^(1|true|yes|on)$/i.test(String(rawFlag).trim())
          var theme = 'dark'
          if (enableLight) {
            var raw = localStorage.getItem('gameshot-preferences')
            if (raw) {
              var parsed = JSON.parse(raw)
              if (parsed && parsed.state && parsed.state.theme === 'light') {
                theme = 'light'
              }
            }
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
