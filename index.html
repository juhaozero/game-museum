<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameShot Museum</title>
    <!-- 深色主场：首屏前应用主题；PUBLIC_ENABLE_LIGHT_MODE 关闭时强制 dark -->
    <script>
      ;(function () {
        try {
          var rawFlag = '%PUBLIC_ENABLE_LIGHT_MODE%'
          var enableLight =
            rawFlag.indexOf('%') === -1 &&
            /^(1|true|yes|on)$/i.test(String(rawFlag).trim())
          var theme = 'dark'
          if (enableLight) {
            var raw = localStorage.getItem('gameshot-preferences')
            if (raw) {
              var parsed = JSON.parse(raw)
              if (parsed && parsed.state && parsed.state.theme === 'light') {
                theme = 'light'
              }
            }
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
